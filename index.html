<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบ ฟิสิกส์ ม.5: สมดุลต่อการหมุนและเสถียรภาพ (30 ข้อ)</title>

    <style>
        body {
            font-family: 'Sarabun', 'Tahoma', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .quiz-container {
            max-width: 800px;

            padding: 30px;

        }
        h1 {

            color: #1a365d;
            margin-bottom: 5px;

        }
        .subtitle {
            text-align: center;
            color: #4a5568;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .progress-bar {
            width: 100%;
            background-color: #edf2f7;
            height: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background-color: #3182ce;
            width: 0%;
            transition: width 0.3s ease;
        }
        .question-number {
            font-weight: bold;
            color: #3182ce;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .options li {

            padding: 14px 18px;
            margin-bottom: 12px;

        .options li:hover {
            background: #ebf8ff;
            border-color: #3182ce;
        }
        .options li.selected {
            background: #ebf8ff;
            border-color: #3182ce;
            font-weight: bold;
            color: #2b6cb0;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            background-color: #3182ce;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        button:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }
        .result-box {
            text-align: center;
            padding: 20px 0;
        }
        .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #2b6cb0;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>แบบทดสอบ วิชาฟิสิกส์ ม.5</h1>
    <div class="subtitle">เรื่อง สมดุลต่อการหมุนและเสถียรภาพของวัตถุ (30 ข้อ)</div>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

    <div id="quiz-screen">
        <div class="question-number" id="q-number">ข้อที่ 1 / 30</div>
        <div class="question-text" id="q-text">กำลังโหลดคำถาม...</div>
        <ul class="options" id="options-list"></ul>
        
        <div class="btn-container">
            <button id="prev-btn" onclick="prevQuestion()" disabled>ข้อก่อนหน้า</button>
            <button id="next-btn" onclick="nextQuestion()">ข้อถัดไป</button>
        </div>
    </div>

    <div id="result-screen" class="result-box" style="display: none;">
        <h2>การทดสอบเสร็จสิ้น!</h2>
        <p>คะแนนที่คุณได้</p>
        <div class="score-display" id="score-text">0 / 30</div>
        <button onclick="location.reload()">ทำแบบทดสอบอีกครั้ง</button>
    </div>
</div>

<script>
const quizData = [
    { q: "1. เงื่อนไขที่ทำให้วัตถุอยู่ใน 'สมดุลต่อการหมุน' คือข้อใด?", opts: ["ก. ผลรวมของแรงภายนอกเป็นศูนย์ (ΣF = 0)", "ข. ผลรวมของโมเมนต์เป็นศูนย์ (ΣM = 0)", "ค. ความเร็วของวัตถุเป็นศูนย์", "ง. วัตถุไม่มีความเร่งเชิงเส้น"], ans: 1 },
    { q: "2. โมเมนต์ของแรง (Moment of Force) มีนิยามตรงกับข้อใด?", opts: ["ก. ผลคูณของแรงกับระยะทางในแนวแรง", "ข. ผลคูณของแรงกับระยะทางตั้งฉากจากจุดหมุนถึงแนวแรง", "ค. ผลหารของแรงด้วยระยะทางตั้งฉาก", "ง. ผลรวมของแรงทั้งหมดที่กระทำต่อจุดหมุน"], ans: 1 },
    { q: "3. ข้อใดเป็นหน่วยในระบบ SI ของโมเมนต์ของแรง?", opts: ["ก. นิวตัน (N)", "ข. นิวตัน/เมตร (N/m)", "ค. นิวตัน-เมตร (N·m)", "ง. จูล/วินาที (J/s)"], ans: 2 },
    { q: "4. เมื่อออกแรงขนาดเท่ากัน กระทำต่อประแจเพื่อขันนอต การออกแรงลักษณะใดจะเกิดโมเมนต์มากที่สุด?", opts: ["ก. ออกแรงที่ปลายประแจ ทำมุม 90 องศากับด้าม", "ข. ออกแรงที่กลางประแจ ทำมุม 90 องศากับด้าม", "ค. ออกแรงที่ปลายประแจ ทำมุม 45 องศากับด้าม", "ง. ออกแรงที่ปลายประแจ ในทิศขนานกับด้าม"], ans: 0 },
    { q: "5. จุดศูนย์กลางมวล (Center of Mass: CM) ของวัตถุคืออะไร?", opts: ["ก. จุดที่แรงโน้มถ่วงกระทำต่อวัตถุเสมอ", "ข. จุดเสมือนเป็นที่รวมของมวลวัตถุทั้งก้อน", "ค. จุดที่อยู่ตรงกลางทางเรขาคณิตเสมอ", "ง. จุดที่ทำให้วัตถุหมุนเร็วที่สุด"], ans: 1 },
    { q: "6. ตำแหน่งจุด CM และจุด CG ของวัตถุจะทับเป็นจุดเดียวกันเมื่อใด?", opts: ["ก. วัตถุมีรูปร่างสมมมาตรเท่านั้น", "ข. วัตถุอยู่ในบริเวณที่สนามโน้มถ่วงสม่ำเสมอ", "ค. วัตถุเคลื่อนที่ด้วยความเร็วคงตัว", "ง. วัตถุอยู่ในสภาวะไร้น้ำหนัก"], ans: 1 },
    { q: "7. แก้วน้ำทรงกรวยวางคว่ำลงบนโต๊ะ จัดเป็นสมดุลประเภทใด?", opts: ["ก. สมดุลเสถียร (Stable Equilibrium)", "ข. สมดุลไม่เสถียร (Unstable Equilibrium)", "ค. สมดุลสะเทิน (Neutral Equilibrium)", "ง. ไม่จัดเป็นสมดุล"], ans: 0 },
    { q: "8. วัตถุที่อยู่ใน 'สมดุลไม่เสถียร' เมื่อถูกรบกวนเล็กน้อย ตำแหน่งจุด CG จะเป็นอย่างไร?", opts: ["ก. อยู่ที่ระดับความสูงเท่าเดิม", "ข. ลอยสูงขึ้นกว่าเดิม", "ค. ลดต่ำลงกว่าเดิม", "ง. เคลื่อนที่ไปในทิศตรงข้าม"], ans: 2 },
    { q: "9. ข้อใดคือลักษณะของวัตถุที่อยู่ใน 'สมดุลสะเทิน'?", opts: ["ก. ลูกฟุตบอลวางอยู่บนพื้นระดับเรียบ", "ข. ปากกาตั้งอยู่บนปลายแหลม", "ค. ตู้เย็นตั้งอยู่บนพื้นระดับ", "ง. ลวดสปริงถูกดึงให้ยืดออก"], ans: 0 },
    { q: "10. ปัจจัยสำคัญที่สุดที่ช่วยให้วัตถุมีเสถียรภาพสูง (ล้มยาก) คือข้อใด?", opts: ["ก. ฐานแคบ และ จุด CG อยู่สูง", "ข. ฐานกว้าง และ จุด CG อยู่สูง", "ค. ฐานกว้าง และ จุด CG อยู่ต่ำ", "ง. ฐานแคบ และ จุด CG อยู่ต่ำ"], ans: 2 },
    { q: "11. รถแข่ง Formula 1 ออกแบบให้ตัวรถต่ำและฐานล้อกว้าง เพื่อวัตถุประสงค์ใดทางฟิสิกส์?", opts: ["ก. ลดแรงเสียดทานของยาง", "ข. เพิ่มความสว่างและทัศนวิสัย", "ค. เพิ่มเสถียรภาพป้องกันการพลิกคว่ำขณะโค้ง", "ง. ลดมวลของตัวรถให้เบาที่สุด"], ans: 2 },
    { q: "12. คานเบายาว 4 เมตร มีจุดหมุนอยู่ตรงกลาง ถ้าแขวนมวล 20 N ที่ปลายซ้าย ต้องแขวนมวลเท่าใดที่ปลายขวาคานจึงจะสมดุล?", opts: ["ก. 10 N", "ข. 20 N", "ค. 40 N", "ง. 80 N"], ans: 1 },
    { q: "13. คานสม่ำเสมอยาว 2 เมตร น้ำหนัก 50 N มีจุดหมุนอยู่ที่ปลายซ้าย ถ้าต้องการให้คานอยู่ในแนวระดับ ต้องออกแรงยกขึ้นที่ปลายขวาเท่าใด?", opts: ["ก. 25 N", "ข. 50 N", "ค. 75 N", "ง. 100 N"], ans: 0 },
    { q: "14. ออกแรง F ขนาด 10 N กระทำต่อด้ามไขควงยาว 0.2 m ในทิศตั้งฉาก โมเมนต์ของแรงรอบจุดหมุนมีค่าเท่าใด?", opts: ["ก. 0.5 N·m", "ข. 2 N·m", "ค. 10 N·m", "ง. 50 N·m"], ans: 1 },
    { q: "15. แรงคู่ควบ (Coupled Forces) คือแรงที่มีลักษณะอย่างไร?", opts: ["ก. แรงสองแรงขนาดเท่ากัน ทิศทางเดียวกัน แนวแรงเดียวกัน", "ข. แรงสองแรงขนาดเท่ากัน ทิศตรงข้าม แนวแรงเดียวกัน", "ค. แรงสองแรงขนาดเท่ากัน ทิศตรงข้าม แนวแรงขนานกันไม่ทับกัน", "ง. แรงสองแรงขนาดไม่เท่ากัน กระทำต่อจุดเดียวกัน"], ans: 2 },
    { q: "16. ผลรวมของแรงลวดทั้งหมดที่เป็นแรงคู่ควบมีค่าเท่าใด?", opts: ["ก. มีค่าเท่ากับแรงใดแรงหนึ่ง", "ข. มีค่าเป็นสองเท่าของแรงเดิม", "ค. มีค่าเป็นศูนย์ (ΣF = 0)", "ง. ไม่สามารถหาค่าได้"], ans: 2 },
    { q: "17. การหมุนพวงมาลัยรถยนต์ด้วยสองมือ เป็นตัวอย่างการใช้แรงประเภทใด?", opts: ["ก. แรงดึงสปริง", "ข. แรงคู่ควบ", "ค. แรงสู่ศูนย์กลาง", "ง. แรงเสียดทานทาน"], ans: 1 },
    { q: "18. เมื่อวัตถุสมดุลต่อการหมุน ข้อใดกล่าวถูกต้องเสมอ?", opts: ["ก. โมเมนต์ทวนเข็ม = โมเมนต์ตามเข็ม", "ข. โมเมนต์ทวนเข็ม > โมเมนต์ตามเข็ม", "ค. โมเมนต์ทวนเข็ม < โมเมนต์ตามเข็ม", "ง. โมเมนต์รอบจุดใดๆ มีค่าไม่คงที่"], ans: 0 },
    { q: "19. เมื่อผลักกล่องบนพื้นระดับ กล่องจะพลิกคว่ำแทนที่จะไถลเมื่อใด?", opts: ["ก. แนวแรงดึงผ่านจุด CG", "ข. แรงเสียดทานมีค่าน้อยมาก", "ค. แนวแรงลัพธ์ออกนอกฐานของกล่อง", "ง. ออกแรงที่ฐานล่างสุดของกล่อง"], ans: 2 },
    { q: "20. บันไดสม่ำเสมอพาดอยู่กับกำแพงลื่น แนวแรงปฏิกิริยาจากกำแพงจะมีทิศอย่างไร?", opts: ["ก. ตั้งฉากกับพื้นดิน", "ข. ตั้งฉากกับกำแพง", "ค. ขนานไปตามแนวบันได", "ง. ชี้เข้าหาจุด CG ของบันได"], ans: 1 },
    { q: "21. แผ่นวัตถุบางรูปทรงไม่แน่นอน สามารถหาจุด CG ได้ด้วยวิธีใด?", opts: ["ก. การใช้น้ำหนักวัด", "ข. การ แขวนวัตถุด้วยเชือกจากจุดต่างๆ แล้วลากแนวเส้นดิ่งตัดกัน", "ค. การจุ่มลงในน้ำเพื่อดูการลอยตัว", "ง. การนำไปหมุนบนแกนความเร็วสูง"], ans: 1 },
    { q: "22. หากวัตถุถูกเอียงจนเส้นแนวแรงเนื่องจากน้ำหนัก (ผ่านจุด CG) ตกอยู่นอกฐาน วัตถุจะเป็นอย่างไร?", opts: ["ก. กลับคืนสู่ตำแหน่งเดิม", "ข. พลิกคว่ำหรือล้มลง", "ค. ลอยขึ้นในอากาศ", "ง. หยุดนิ่งในท่าเอียงนั้น"], ans: 1 },
    { q: "23. กรวยจราจรที่วางตั้งบนฐานกว้าง จัดเป็นสมดุลประเภทใด?", opts: ["ก. สมดุลเสถียร", "ข. สมดุลไม่เสถียร", "ค. สมดุลสะเทิน", "ง. สมดุลจลน์"], ans: 0 },
    { q: "24. หากวางกรวยจราจรนอนลงกับพื้น แล้วเอามือรอกรวยให้หมุนไปรอบๆ จัดเป็นสมดุลประเภทใด?", opts: ["ก. สมดุลเสถียร", "ข. สมดุลไม่เสถียร", "ค. สมดุลสะเทิน", "ง. ไม่อยู่ในสมดุล"], ans: 2 },
    { q: "25. ข้อใดกล่าวถูกต้องเกี่ยวกับโมเมนต์ของแรงคู่ควบ?", opts: ["ก. ขึ้นอยู่กับตำแหน่งของจุดหมุน", "ข. มีค่าไม่คงที่ เปลี่ยนไปตามระยะหมุน", "ค. มีค่าเท่ากับ ผลคูณของแรงใดแรงหนึ่งกับระยะห่างระหว่างแนวแรงทั้งสอง", "ง. มีค่าเท่ากับศูนย์เสมอ"], ans: 2 },
    { q: "26. คนยืนแบกหามของไว้ข้างหลัง มักจะก้มตัวมาข้างหน้าเล็กน้อย เพราะเหตุใด?", opts: ["ก. เพื่อลดแรงเสียดทานที่เท้า", "ข. เพื่อเลื่อนจุด CG รวมให้ตกอยู่ภายในพื้นที่ฐานเท้า", "ค. เพื่อเพิ่มมวลของร่างกาย", "ง. เพื่อให้แรงโน้มถ่วงกระทำน้อยลง"], ans: 1 },
    { q: "27. ไม้เมตรสม่ำเสมอมวล 0.2 kg มีจุดหมุนที่ขีด 50 cm ถ้าแขวนมวล 0.1 kg ที่ขีด 20 cm ต้องแขวนมวล 0.2 kg ที่ขีดใดคานจึงจะสมดุล?", opts: ["ก. ขีด 35 cm", "ข. ขีด 65 cm", "ค. ขีด 70 cm", "ง. ขีด 80 cm"], ans: 1 },
    { q: "28. บันไดพาดกำแพงลื่น แต่พื้นล่างขรุขระ แรงเสียดทานที่พื้นล่างจะมีทิศทางอย่างไร?", opts: ["ก. ทิศชี้เข้าหากำแพง", "ข. ทิศชี้ออกจากกำแพง", "ค. ทิศชี้ขึ้นตามแนวบันได", "ง. ทิศชี้ลงในแนวดิ่ง"], ans: 0 },
    { q: "29. วัตถุชิ้นหนึ่งอยู่ภายใต้สมดุลสัมบูรณ์ (Absolute Equilibrium) หมายความว่าอย่างไร?", opts: ["ก. สมดุลต่อการเคลื่อนที่เท่านั้น", "ข. สมดุลต่อการหมุนเท่านั้น", "ค. สมดุลต่อการเคลื่อนที่ และ สมดุลต่อการหมุน พร้อมกัน", "ง. วัตถุต้องหยุดนิ่งไม่มีแรงใดๆ กระทำ"], ans: 2 },
    { q: "30. คานยาว L มีน้ำหนัก W อยู่ตรงกลาง หากนำวัตถุหนัก 2W มาแขวนไว้ที่ปลายด้านหนึ่ง จะต้องวางจุดหมุนห่างจากปลายด้านนั้นเท่าใด คานจึงจะอยู่ในแนวระดับ?", opts: ["ก. L/6", "ข. L/4", "ค. L/3", "ง. L/2"], ans: 0 }
];

let currentIdx = 0;
let userAnswers = new Array(quizData.length).fill(null);

function loadQuestion() {
    const q = quizData[currentIdx];
    document.getElementById("q-number").innerText = `ข้อที่ ${currentIdx + 1} / ${quizData.length}`;
    document.getElementById("q-text").innerText = q.q;
    
    const optionsList = document.getElementById("options-list");
    optionsList.innerHTML = "";

    q.opts.forEach((opt, idx) => {
        const li = document.createElement("li");
        li.innerText = opt;
        if (userAnswers[currentIdx] === idx) {
            li.classList.add("selected");
        }
        li.onclick = () => selectOption(idx);
        optionsList.appendChild(li);
    });

    document.getElementById("prev-btn").disabled = currentIdx === 0;
    
    if (currentIdx === quizData.length - 1) {
        document.getElementById("next-btn").innerText = "ส่งคำตอบ";
    } else {
        document.getElementById("next-btn").innerText = "ข้อถัดไป";
    }

    // Update Progress Bar
    const progressPercent = ((currentIdx + 1) / quizData.length) * 100;
    document.getElementById("progress").style.width = `${progressPercent}%`;
}

function selectOption(idx) {
    userAnswers[currentIdx] = idx;
    loadQuestion();
}

function nextQuestion() {
    if (userAnswers[currentIdx] === null) {
        alert("กรุณาเลือกคำตอบก่อนไปข้อถัดไป");
        return;
    }
    if (currentIdx < quizData.length - 1) {
        currentIdx++;
        loadQuestion();
    } else {
        showResults();
    }
}

function prevQuestion() {
    if (currentIdx > 0) {
        currentIdx--;
        loadQuestion();
    }
}

function showResults() {
    let score = 0;
    userAnswers.forEach((ans, idx) => {
        if (ans === quizData[idx].ans) {
            score++;
        }
    });

    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";
    document.getElementById("score-text").innerText = `${score} / ${quizData.length}`;
}

// เริ่มต้นเปิดข้อแรก
loadQuestion();
</script>

</body>
</html>
